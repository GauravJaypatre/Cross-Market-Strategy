# Fixed Universe Configuration
# Top 15 Economies (IMF World Economic Outlook, October 2024 Database)
# Up to 3 liquid indices per country, with sanctioned Russia (#9) substituted by next-ranked Indonesia (#16).
# Read dynamically from this file — never hardcoded in logic.

indices:
